<style>
:root{--bg:#000;--txt:#fff;--sub:#9a9aa0;--red:#ff2d55;--glass:rgba(40,40,44,.55);--line:rgba(255,255,255,.14);--card:#1c1c1e}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--line)}
header{position:sticky;top:0;z-index:10;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#000 60%,transparent)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:21px;letter-spacing:-.5px;cursor:pointer}
.logo img{width:32px;height:32px;border-radius:9px}
#inst{display:none;color:#fff;padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;background:linear-gradient(135deg,#ff2d55,#5856d6);flex:none}
main{max-width:1300px;margin:auto}
#chips{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 12px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:99px;font-size:14px;font-weight:500;cursor:pointer;color:var(--txt)}
.chip.on{background:#fff;color:#000;border-color:#fff}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;padding:0 12px}
.card{cursor:pointer}
.thumb{position:relative;aspect-ratio:16/9;background:var(--card);border-radius:22px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.dur{position:absolute;right:10px;bottom:10px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px}
.soon{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:14px}
.meta{display:flex;gap:11px;padding:10px 4px 0}
.nom{font-weight:600;font-size:15px;line-height:1.3}
.crea{color:var(--sub);font-size:13px;margin-top:3px}
#search,#chan{display:none;padding:6px 16px}
#q{width:100%;padding:13px 18px;border-radius:99px;color:var(--txt);font-size:16px;outline:0}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;cursor:pointer;border-bottom:1px solid var(--line)}
.row .avatar{width:48px;height:48px;font-size:19px}
#watch{display:none;max-width:1000px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 12px 0}
#back{border:0;color:var(--txt);padding:9px 16px;border-radius:99px;margin-bottom:12px;font-size:14px;cursor:pointer}
.player{aspect-ratio:16/9;background:#000;border-radius:22px;overflow:hidden}
.player video,.player iframe{width:100%;height:100%;border:0}
#watch h1{font-size:20px;margin:14px 4px 10px;line-height:1.3}
.who{display:flex;align-items:center;gap:11px;padding:0 4px}
.who b{display:block;font-size:15px}
.who .sub{margin-left:auto;background:#fff;color:#000;border:0;padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;cursor:pointer}
.act{display:flex;gap:8px;margin:14px 4px}
.act button{border-radius:99px;padding:9px 16px;color:var(--txt);font-size:14px;cursor:pointer}
#watch h3{margin:22px 4px 12px;font-size:17px}
#autres{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:4px;padding:6px;border-radius:99px;width:min(360px,calc(100% - 28px))}
nav button{flex:1;border:0;background:none;color:var(--sub);padding:8px 0;border-radius:99px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff;background:rgba(255,255,255,.16)}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="go('home')"><img id="logoimg" alt="">TalcoWatcher</div>
  <div style="display:flex;align-items:center;gap:10px"><button id="inst" class="glass">Installer</button><div class="avatar">T</div></div>
</header>
<main>
  <div id="home"><div id="chips"></div><div id="grid"></div></div>
  <div id="search"><input id="q" class="glass" type="search" placeholder="Rechercher" oninput="render()"><div id="res" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;margin-top:18px"></div></div>
  <div id="chan"></div>
</main>
<div id="watch">
  <button id="back" class="glass" onclick="quitter()">← Retour</button>
  <div class="player" id="player"></div>
  <h1 id="wNom"></h1>
  <div class="who"><div class="avatar" id="wAv"></div><div><b id="wCrea"></b><span class="crea" id="wDur"></span></div><button class="sub">S'abonner</button></div>
  <div class="act"><button class="glass" onclick="partager()">↗ Partager</button></div>
  <h3>Autres vidéos</h3>
  <div id="autres"></div>
</div>
<nav class="glass">
  <button data-t="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Accueil</button>
  <button data-t="search" onclick="go('search')"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Recherche</button>
  <button data-t="chan" onclick="go('chan')"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>Chaînes</button>
</nav>

<script>
/* ============================================================
   AJOUTER UNE VIDÉO : copie une ligne, change les 3 champs.
   - nom       : titre de la vidéo
   - createur  : nom de la chaîne
   - lien      : lien Cloudinary (.mp4) OU lien Google Drive
   (lien vide "" = carte "Bientôt disponible")
   La durée se calcule toute seule pour Cloudinary.
   ============================================================ */
const VIDEOS = [
  { nom: "KAIZEN", createur: "Inoxtag", lien: "https://drive.google.com/file/d/1kn4NwWkQxmdrBzA8jRxTBnsyrTqompok/view?usp=drivesdk" },
  { nom: "LGV France", createur: "Le Ferrovipathe", lien: "https://drive.google.com/file/d/1FVnBpePkoDk4JC1_gsTEz27hgIUELl_h/view?usp=drivesdk" },
  { nom: "Discours de la Servitude Volontaire", createur: "Amélie Vioux", lien: "https://res.cloudinary.com/jjmksoqr/video/upload/v1790075207/YTDown.com_YouTube_Media_pWuWesEd4P8_002_720p.mp4" },
  { nom: "Cahier de Douaï", createur: "Amélie Vioux", lien: "https://res.cloudinary.com/jjmksoqr/video/upload/v1790075888/YTDown.com_YouTube_Media_SJAiZ-9gu40_002_720p.mp4" },
  { nom: "Pour un oui pour un non", createur: "Amélie Vioux", lien: "" },
];

/* ---------- Code du site (pas besoin d'y toucher) ---------- */
const $ = id => document.getElementById(id);
const driveId = l => (l.match(/drive\.google\.com\/file\/d\/([^/?]+)/) || [])[1];
const estDrive = v => !!driveId(v.lien);
const vignette = v => !v.lien ? "" : estDrive(v)
  ? `https://drive.google.com/thumbnail?id=${driveId(v.lien)}&sz=w800`
  : v.lien.replace(/\.(mp4|mov|webm)$/i, ".jpg");
const fmt = s => { s=Math.round(s); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h ? h+":"+String(m).padStart(2,"0") : m)+":"+String(x).padStart(2,"0"); };
const ini = n => n.trim()[0].toUpperCase();
let tab = "home", filtre = "", courant = -1;

VIDEOS.forEach(v => {
  v.duree = "";
  if (!v.lien || estDrive(v)) return;
  const el = document.createElement("video");
  el.preload = "metadata"; el.src = v.lien;
  el.onloadedmetadata = () => { v.duree = fmt(el.duration); render(); };
});

function carte(v, i) {
  const clic = v.lien ? `onclick="lire(${i})"` : "";
  return `<div class="card" ${clic}>
    <div class="thumb">${v.lien ? `<img src="${vignette(v)}" alt="" loading="lazy" onerror="this.style.display='none'">` : `<div class="soon">Bientôt disponible</div>`}
    ${v.duree ? `<span class="dur glass">${v.duree}</span>` : ""}</div>
    <div class="meta"><div class="avatar">${ini(v.createur)}</div>
    <div><div class="nom">${v.nom}</div><div class="crea">${v.createur}</div></div></div></div>`;
}
const createurs = () => [...new Set(VIDEOS.map(v => v.createur))];

function render() {
  const liste = f => VIDEOS.map((v,i)=>[v,i]).filter(([v]) => f(v)).map(([v,i]) => carte(v,i)).join("");
  $("chips").innerHTML = ["Tout", ...createurs()].map(c =>
    `<div class="chip glass ${(c==="Tout"?"":c)===filtre?"on":""}" onclick="filtrer('${c.replace(/'/g,"\\'")}')">${c}</div>`).join("");
  $("grid").innerHTML = liste(v => !filtre || v.createur === filtre);
  const t = $("q").value.toLowerCase();
  $("res").innerHTML = liste(v => (v.nom+" "+v.createur).toLowerCase().includes(t)) || "<p class='crea'>Aucun résultat</p>";
  $("chan").innerHTML = createurs().map(c =>
    `<div class="row" onclick="filtrer('${c.replace(/'/g,"\\'")}')"><div class="avatar">${ini(c)}</div>
    <div><div class="nom">${c}</div><div class="crea">${VIDEOS.filter(v=>v.createur===c).length} vidéo(s)</div></div></div>`).join("");
}
function filtrer(c) { filtre = c === "Tout" ? "" : c; go("home"); }
function go(t) {
  quitter(true); tab = t;
  ["home","search","chan"].forEach(x => $(x).style.display = x===t ? "block" : "none");
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t===t));
  render(); scrollTo(0,0);
  if (t==="search") $("q").focus();
}
function lire(i) {
  const v = VIDEOS[courant = i];
  document.querySelector("main").style.display = "none"; document.querySelector("header").style.display = "none";
  $("watch").style.display = "block";
  $("player").innerHTML = estDrive(v)
    ? `<iframe src="https://drive.google.com/file/d/${driveId(v.lien)}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`
    : `<video src="${v.lien}" controls autoplay playsinline></video>`;
  $("wNom").textContent = v.nom; $("wCrea").textContent = v.createur; $("wAv").textContent = ini(v.createur);
  $("wDur").textContent = v.duree ? " " + v.duree : "";
  $("autres").innerHTML = VIDEOS.map((x,j)=>j===i?"":carte(x,j)).join("");
  document.title = v.nom + " – TalcoWatcher"; scrollTo(0,0);
}
function quitter(silencieux) {
  $("player").innerHTML = ""; $("watch").style.display = "none";
  document.querySelector("main").style.display = ""; document.querySelector("header").style.display = "";
  document.title = "TalcoWatcher"; courant = -1;
}
function partager() {
  const d = { title: VIDEOS[courant].nom, url: location.href };
  navigator.share ? navigator.share(d).catch(()=>{}) : navigator.clipboard && navigator.clipboard.writeText(d.url);
}
$("logoimg").src = document.querySelector('link[rel=icon]').href;
let dp = null;
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), appli = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
if (ios && !appli) $("inst").style.display = "block";
addEventListener("beforeinstallprompt", e => { e.preventDefault(); dp = e; $("inst").style.display = "block"; });
addEventListener("appinstalled", () => $("inst").style.display = "none");
$("inst").onclick = async () => {
  if (dp) { dp.prompt(); await dp.userChoice; dp = null; $("inst").style.display = "none"; }
  else alert("Dans Safari : touche Partager (carré avec flèche), puis « Sur l'écran d'accueil ».");
};
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
go("home");
</script>
</body>
</html>
